<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 500px;
            height: 300px;
            border: 2px solid black;
            display: flex; align-items: flex-end;
            gap: 15px;
        }
        .barra {
            width: 40px;
            background-color: blue;
            height: 0px;
            transition: height 1s ease;
        }
        .container:hover .barra {
            height: 250px;
            transition-delay: calc(var(--ordem) * 0.2s);
        }
        
    </style>
    </head>

<body>
    <div class="container">
        <div class="barra" style="--ordem:1 "></div>
        <div class="barra" style="--ordem:2 "></div>
        <div class="barra" style="--ordem:3 "></div>
        <div class="barra" style="--ordem:4 "></div>
        <div class="barra" style="--ordem:5 "></div>
        
    </div>
</body>
</html>
