<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slideshow Completo - Atividades 7 a 10</title>
  <!-- Organização do CSS em arquivos separados exigida na prova -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme-a.css">
  <link rel="stylesheet" href="theme-b.css">
</head>
<body>

  <main class="container">
    <h1>My Slideshow</h1>

    <!-- Seleção nativa de arquivos (Atividade 7) -->
    <div class="campo-arquivo">
      <label for="imageInput">Selecione imagens do dispositivo:</label>
      <input type="file" id="imageInput" accept="image/*" multiple>
    </div>

    <!-- Zona de Drop para arquivos externos do computador (Atividade 7) -->
    <div id="dropzone" class="area-soltar">
      <p>Arraste e solte fotos do computador aqui</p>
    </div>

    <!-- Ações auxiliares (Botões principais visíveis) -->
    <div class="acoes">
      <button type="button" id="btnAmostras">Carregar fotos de amostra</button>
      <button type="button" id="btnAbrirComandos" aria-keyshortcuts="Control+K /">Barra de Comandos (Ctrl+K ou /)</button>
      <button type="button" id="btnIniciarSlideshow" class="btn-destaque">▶ Iniciar Slideshow</button>
    </div>

    <!-- Galeria reordenável: miniaturas arrastáveis sincronizadas com os dados (Atividade 8) -->
    <ul id="lista-imagens" class="galeria-fotos"></ul>
  </main>

  <!-- ========================================================
       BARRA DE COMANDOS / PALETA FLUTUANTE (Atividade 9)
       ======================================================== -->
  <div id="commandBarOverlay" class="command-bar-overlay hidden">
    <div class="command-bar-box" role="dialog" aria-modal="true" aria-label="Barra de Comandos">
      <!-- Campo de pesquisa e digitação de comandos -->
      <input 
        type="text" 
        id="commandInput" 
        placeholder="Digite um comando..." 
        autocomplete="off"
        spellcheck="false"
      >
      <!-- Lista onde as opções filtradas aparecem -->
      <ul id="commandList" class="command-list" role="listbox"></ul>
    </div>
  </div>

  <!-- ========================================================
       REPRODUTOR DE SLIDESHOW EM TELA CHEIA (Atividade 10)
       ======================================================== -->
  <section id="slideshowContainer" class="slideshow-player hidden" aria-label="Visualizador de Slides">
    <!-- Barra superior de controles do player -->
    <div class="player-controls">
      <button type="button" id="btnFullscreen" title="Alternar Tela Cheia">⛶ Tela Cheia</button>
      <button type="button" id="btnSairSlideshow" title="Fechar Slideshow">✕ Fechar</button>
    </div>

    <!-- Palco central onde a foto e a legenda são exibidas -->
    <div id="slideStage" class="slide-stage theme-a">
      <div id="slideContent" class="slide-content">
        <img id="slideImage" src="" alt="Foto atual do slide">
        <p id="slideCaption" class="slide-caption"></p>
      </div>
    </div>

    <!-- Barra inferior com contador e modo de reprodução ativo -->
    <div class="player-info">
      <span id="playerCounter">Slide 1 de 1</span>
      <span id="playerMode">Modo: Manual (Setas ← / →)</span>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
