<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova Modulo E - 3D Loop</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            margin: 0;
        }

        .palco {
            width: 600px;
            height: 400px;
            position: relative;
            /* Câmera mais próxima para um 3D muito mais agressivo e realista */
            perspective: 800px; 
        }

        /* Foto fixa do fundo (Foto 4). O cursor pointer avisa que pode clicar para reiniciar */
        .foto-fundo {
            width: 100%;
            height: 100%;
            position: absolute;
            background-size: 600px 400px;
            cursor: pointer; 
        }

        .camada {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        /* Regras gerais para todas as metades */
        .metade-direita, .metade-esquerda {
            width: 50%;
            height: 100%;
            position: absolute;
            /* Garante que a foto tenha o tamanho exato do palco (não duplica e não esmaga) */
            background-size: 600px 400px; 
            /* MÁGICA: Quando a porta roda para trás, ela desaparece! */
            backface-visibility: hidden; 
        }

        .metade-esquerda {
            transform-origin: left;
            transition: transform 1.5s ease-in-out; /* Tempo suave igual ao vídeo */
            background-position: left; /* Corta a imagem na esquerda */
        }

        .metade-direita {
            right: 0;
            transform-origin: right;
            transition: transform 1.5s ease-in-out; /* Tempo suave igual ao vídeo */
            background-position: right; /* Corta a imagem na direita */
        }

        /* Abertura total de 180 graus (como a capa de um livro abrindo até ao fim) */
        .camada.aberta .metade-esquerda {
            transform: rotateY(-180deg);
        }
        .camada.aberta .metade-direita {
            transform: rotateY(180deg);
        }

        /* O vidro invisível: deixa o clique passar para a camada de baixo */
        .camada.aberta {
            pointer-events: none;
        }

        /* Conectando os nomes exatos das suas imagens */
        .foto1 { background-image: url('foto1.jpg'); }
        .foto2 { background-image: url('foto2.jpg'); }
        .foto3 { background-image: url('foto3.jpg'); }
        .foto4 { background-image: url('foto4.jpg'); }
    </style>
</head>
<body>
    <div class="palco">
        <!-- 4ª FOTO (FUNDO): Ao clicar nela, a função chama o JavaScript para reiniciar o loop -->
        <div class="foto-fundo foto4" onclick="reiniciarLoop()"></div>

        <!-- 3ª FOTO: Quando abre, revela a 4 -->
        <div class="camada" onclick="this.classList.add('aberta')">
            <div class="metade-esquerda foto3"></div>
            <div class="metade-direita foto3"></div>
        </div>

        <!-- 2ª FOTO: Quando abre, revela a 3 -->
        <div class="camada" onclick="this.classList.add('aberta')">
            <div class="metade-esquerda foto2"></div>
            <div class="metade-direita foto2"></div>
        </div>

        <!-- 1ª FOTO: Fica no topo. Quando abre, revela a 2 -->
        <div class="camada" onclick="this.classList.add('aberta')">
            <div class="metade-esquerda foto1"></div>
            <div class="metade-direita foto1"></div>
        </div>
    </div>

    <!-- O JAVASCRIPT QUE CRIA A REPETIÇÃO -->
    <script>
        function reiniciarLoop() {
            // Procura todas as camadas e remove a classe "aberta", fechando todas as portas de uma vez!
            let camadas = document.querySelectorAll('.camada');
            camadas.forEach(function(camada) {
                camada.classList.remove('aberta');
            });
        }
    </script>
</body>
</html>
