<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 8 - Slideshow: Reordenar Fotos por Drag and Drop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>My Slideshow</h1>

    <!-- Seleção nativa de arquivos (Atividade 7) -->
    <div class="campo-arquivo">
      <label for="imageInput">Selecione imagens do dispositivo:</label>
      <input type="file" id="imageInput" accept="image/*" multiple>
    </div>

    <!-- Zona de Drop para arquivos externos do computador (Atividade 7) -->
    <div id="dropzone" class="area-soltar">
      <p>Arraste e solte fotos do computador aqui</p>
    </div>

    <!-- Ações auxiliares -->
    <div class="acoes">
      <button type="button" id="btnAmostras">Carregar fotos de amostra</button>
    </div>

    <!-- Galeria reordenável: miniaturas arrastáveis sincronizadas com os dados -->
    <ul id="lista-imagens" class="galeria-fotos"></ul>
  </main>

  <!-- BARRA DE COMANDOS (Atividade 9) -->
  <div id="commandBarOverlay" class="command-bar-overlay hidden">
    <div class="command-bar-box" role="dialog" aria-modal="true" aria-label="Barra de Comandos">
      <!-- Campo de pesquisa -->
      <input 
        type="text" 
        id="commandInput" 
        placeholder="Digite um comando..." 
        autocomplete="off"
        spellcheck="false"
      >
      <button type="button" id="btnIniciarSlideshow">Iniciar Slideshow</button>
      <!-- Lista onde as opções filtradas vão aparecer -->
      <ul id="commandList" class="command-list" role="listbox"></ul>
    </div>
  </div>
  <!-- Reprodutor de Slideshow (Atividade 10) -->
    <section id="slideshowContainer" class="slideshow-player hidden">
      <!-- Barra superior de controles do player -->
      <div class="player-controls">
        <button type="button" id="btnFullscreen" title="Tela Cheia">⛶ Tela Cheia</button>
        <button type="button" id="btnSairSlideshow" title="Fechar Slideshow">✕ Fechar</button>
      </div>

      <!-- Palco onde a foto e a legenda são exibidas -->
      <div id="slideStage" class="slide-stage theme-a">
        <div class="slide-content">
          <img id="slideImage" src="" alt="Foto atual do slide">
          <p id="slideCaption" class="slide-caption"></p>
        </div>
      </div>

      <!-- Indicador de slide e modo -->
      <div class="player-info">
        <span id="playerCounter">Slide 1 de 1</span>
        <span id="playerMode">Modo: Manual</span>
      </div>
    </section>
  <script src="script.js"></script>
</body>
</html>
