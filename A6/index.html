<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Pesada</title>
    <style>#loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* 3. Desenho do spinner com CSS puro */
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #e5e5e5;       /* fundo cinza-claro */
      border-top: 6px solid #007bff;   /* arco azul */
      border-radius: 50%;              /* círculo */
      
      /* 4. Animação infinita e linear */
      animation: girar 1s linear infinite;
    }

    /* Keyframes da rotação */
    @keyframes girar {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* Classe para ocultar o spinner */
    .hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Estilo do conteúdo da página pesada */
    .content {
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    .content img {
      width: 100%;
      height: auto;
      margin: 20px 0;
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- 2. Overlay do Spinner no topo do body -->
  <div id="loading-screen">
    <div class="spinner"></div>
  </div>

  <!-- 1. Conteúdo pesado (Textos longos e imagens em alta resolução) -->
  <main class="content">
    <h1>Artigo com Alta Densidade de Conteúdo</h1>
    

    <!-- Imagens não cacheadas com dimensões 4K (pesadas para transferência) -->
    <img src="https://picsum.photos/id/1015/1920/1080" alt="Imagem Pesada 1">


    <img src="https://picsum.photos/id/1016/1920/1080" alt="Imagem Pesada 2">

    

    <img src="https://picsum.photos/id/1018/1920/1080" alt="Imagem Pesada 3">
  </main>

  <!-- 5. Script para escutar o término do carregamento completo (window load) -->
  <script>
    // 'load' dispara somente após o DOM, imagens, folhas de estilo e scripts estarem 100% carregados
    window.addEventListener('load', () => {
      const loader = document.getElementById('loading-screen');
      loader.classList.add('hidden');
    });
  </script>

</body>
</html>
